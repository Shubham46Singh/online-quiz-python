
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: qa
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: qa
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: quizdb
            - name: POSTGRES_USER
              value: quizuser
            - name: POSTGRES_PASSWORD
              value: quizpass
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U quizuser -d quizdb"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: qa
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: qa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: batch/v1
kind: Job
metadata:
  name: quiz-migrations
  namespace: qa
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -U quizuser -d quizdb; do sleep 2; done
              for f in /migrations/001_schema.sql /migrations/002_seed.sql; do
                PGPASSWORD=quizpass psql -h postgres -U quizuser -d quizdb -v ON_ERROR_STOP=1 -f "$f" || exit 1
              done
          env:
            - name: PGPASSWORD
              value: quizpass
          volumeMounts:
            - name: migrations
              mountPath: /migrations
      volumes:
        - name: migrations
          configMap:
            name: quiz-migrations
---
apiVersion: v1
kind: Service
metadata:
  name: online-quiz
  namespace: qa
spec:
  selector:
    app: online-quiz
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: online-quiz
  namespace: qa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: online-quiz
  template:
    metadata:
      labels:
        app: online-quiz
    spec:
      imagePullSecrets:
        - name: dockerhub
      initContainers:
        - name: wait-for-migrations
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -U quizuser -d quizdb; do sleep 2; done
              until PGPASSWORD=quizpass psql -h postgres -U quizuser -d quizdb -tAc "SELECT to_regclass('public.attempts')" | grep -q attempts; do sleep 2; done
      containers:
        - name: app
          image: pprraannaavv/online-quiz-python:qa
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              value: postgresql://quizuser:quizpass@postgres:5432/quizdb
            - name: REDIS_URL
              value: redis://redis:6379/0
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
